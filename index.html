<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Electric Bike Superstore</title>
    <!-- Instant Meta Redirect -->
    <meta http-equiv="refresh" content="0; url=https://shop.theelectricbikesuperstore.com">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { text-align: center; color: #334155; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #2563eb; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>Routing securely to our store...</h1>
        <p>If you are not redirected automatically, <a href="https://shop.theelectricbikesuperstore.com" style="color: #2563eb; text-decoration: none; font-weight: bold;">click here</a>.</p>
    </div>
    <!-- Fallback JavaScript Redirect -->
    <script>
        window.location.replace("https://shop.theelectricbikesuperstore.com");
    </script>
</body>
</html>
